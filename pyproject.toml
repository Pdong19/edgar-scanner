[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-scanner"
version = "0.1.0"
description = "Autonomous SEC filing scanner that extracts investment signals from EDGAR full-text search, XBRL financials, Form 4 insider transactions, and 10-K moat language."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "edgartools>=2.0.0",
    "yfinance>=0.2.30",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly: ruff's DEFAULT selection has grown across
# versions (0.16 flags 190 issues here that 0.4-era defaults did not), and CI
# installs latest — an unpinned select is a delayed CI failure.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
"src/**" = ["E402"]
